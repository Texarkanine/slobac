name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taxonomy-index:
    uses: ./.github/workflows/reusable-taxonomy-index-check.yml

  docs-build:
    uses: ./.github/workflows/reusable-docs-build.yml
