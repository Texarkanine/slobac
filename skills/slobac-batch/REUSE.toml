version = 1
SPDX-PackageName = "slobac-batch"
SPDX-PackageSupplier = "Texarkanine <texarkanine@protonmail.com>"

# Prompt-shaped Agent Skills payload (this skill root as standalone distribution)
[[annotations]]
path = ["**/*"]
SPDX-FileCopyrightText = "Texarkanine"
SPDX-License-Identifier = "LicenseRef-PPL-S"

# Uses bundled AGPL text (PPL-S extends AGPL); satisfies REUSE “used license” for LICENSES/AGPL-3.0-or-later.txt
[[annotations]]
path = ["BUNDLED-AGPL.md"]
precedence = "override"
SPDX-FileCopyrightText = "Texarkanine"
SPDX-License-Identifier = "AGPL-3.0-or-later"
